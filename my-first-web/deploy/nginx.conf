server {
    listen 80;
    server_name moawmoaws.beauty www.moawmoaws.beauty;

    root /var/www/moawmoaws;
    index index.html;

    # Cấu hình xử lý cho các file tĩnh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache các tài nguyên tĩnh để tối ưu hóa tốc độ tải trang
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Admin: bảo vệ bằng mật khẩu Nginx (tạo 1 lần trên VPS)
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-moaw admin
    location = /admin.html {
        auth_basic "MOAW Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-moaw;
        try_files $uri =404;
    }

    # Chặn truy cập vào các thư mục ẩn và các file cấu hình hệ thống
    location ~ /\. {
        deny all;
    }
}
